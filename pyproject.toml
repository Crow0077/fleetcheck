[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetcheck"
version = "0.1.0"
description = "Behavioral audit for AI agent fleets: find dead, orphaned, stale, and misconfigured automations."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "fleetcheck"}]
keywords = ["ai-agent", "audit", "cron", "observability", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
fleetcheck = "fleetcheck.cli:main"

[project.urls]
Homepage = "https://github.com/xhuljano/fleetcheck"

[tool.setuptools.packages.find]
where = ["."]
include = ["fleetcheck*"]
